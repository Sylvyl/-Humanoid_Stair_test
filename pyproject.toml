[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-stair-autonomy"
version = "0.1.0"
description = "Safety-gated stair perception and learning dashboard for AgiBot X2 Ultra"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
x2-stair-dashboard = "x2_stair_autonomy.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

